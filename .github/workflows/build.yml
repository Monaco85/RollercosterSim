name: Windows-EXE bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
      - name: Bauen
        working-directory: bridge
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../Achterbahn.exe .
      - name: Paket zusammenstellen
        run: |
          mkdir -p paket/Achterbahn
          cp Achterbahn.exe LIESMICH.txt paket/Achterbahn/
          cd paket && zip -qr ../Achterbahn-Windows.zip Achterbahn
      - uses: actions/upload-artifact@v4
        with:
          name: Achterbahn-Windows
          path: Achterbahn-Windows.zip
      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Achterbahn ${{ github.ref_name }}
          body_path: RELEASE.md
          files: Achterbahn-Windows.zip
